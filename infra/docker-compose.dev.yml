# Lokal dev muhiti: PostgreSQL 16 + MinIO (Cloudflare R2 o'rnini bosuvchi S3-mos saqlash).
#
#   docker compose -f infra/docker-compose.dev.yml up -d
#   docker compose -f infra/docker-compose.dev.yml down        # to'xtatish (ma'lumot saqlanadi)
#   docker compose -f infra/docker-compose.dev.yml down -v     # ma'lumotlar bilan o'chirish
#
# Portlar standart emas (boshqa loyihalar bilan to'qnashmaslik uchun); kerak bo'lsa env orqali
# o'zgartiring: BLOG_ODYA_PG_PORT, BLOG_ODYA_MINIO_PORT, BLOG_ODYA_MINIO_CONSOLE_PORT.
# Bu yerdagi login/parollar faqat lokal dev uchun.
name: blog-odya

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blog_odya
    ports:
      - '${BLOG_ODYA_PG_PORT:-5442}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d blog_odya']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # quay.io/minio (2026-09-24 dan 401) va Docker Hub minio/* endi tortilmaydi — o'sha MinIO relizi
    # Bitnami legacy qayta paketlashidan (tag + digest). Bitnami entrypoint chetlab o'tiladi,
    # root sifatida /data'da ishlaydi — mavjud minio-data volume'lari bilan mos.
    image: bitnamilegacy/minio:2025.4.22-debian-12-r2@sha256:50cec18ac4184af4671a78aedd5554942c8ae105d51a465fa82037949046da01
    user: root
    entrypoint: ['minio']
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Payload clientUploads: brauzer faylni imzolangan URL bilan to'g'ridan-to'g'ri PUT qiladi —
      # S3 API CORS ruxsati kerak. MinIO'da bucket CORS API yo'q, ruxsat server darajasida beriladi
      # (lokal dev uchun barcha origin'lar). R2 uchun: docs/runbooks/r2-cors.md
      MINIO_API_CORS_ALLOW_ORIGIN: '*'
    ports:
      - '${BLOG_ODYA_MINIO_PORT:-9010}:9000'
      - '${BLOG_ODYA_MINIO_CONSOLE_PORT:-9011}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  # Bir martalik init: media, raw, backups bucketlarini yaratadi.
  # media — ommaviy o'qish (production'da media.odya.uz → R2 kabi).
  minio-init:
    image: bitnamilegacy/minio-client:2025.4.16-debian-12-r2@sha256:8a86e441decf053093c5977d49290298295f850c7843652f93e970ab15871dd1
    user: root
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    entrypoint: >
      /bin/sh -c "
      set -e;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      for b in media raw backups; do mc mb --ignore-existing local/$$b; done;
      mc anonymous set download local/media;
      echo 'MinIO bucketlari tayyor: media, raw, backups';
      "

volumes:
  postgres-data:
  minio-data:
