# CI: lint → typecheck → test (Postgres + MinIO) → seed → build → Playwright smoke → Lighthouse CI
# (TZ §9.7, §8.4).
# Yopiq repo'da bepul daqiqalarni tejash uchun faqat PR va main'ga push'da ishlaydi.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blog_odya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blog_odya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Faqat CI uchun test qiymatlari — haqiqiy sirlar emas.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blog_odya
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5432/blog_odya
      PAYLOAD_SECRET: ci-only-not-a-secret-0123456789abcdef
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: media
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: 'true'
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      JOBS_MODE: endpoint
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live && break
            sleep 1
          done
          # media bucket (seed demo muqovalari va testlar uchun).
          docker run --rm --network host --entrypoint sh \
            quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z \
            -c 'mc alias set local http://localhost:9000 minioadmin minioadmin && mc mb --ignore-existing local/media'

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate
        run: pnpm migrate

      - name: Test
        run: pnpm test

      # Demo postlar (e2e uchun). Build DB'ga ulanmaydi — sahifalar birinchi so'rovda chiziladi (ISR).
      - name: Seed
        run: pnpm seed

      - name: Build
        run: pnpm build

      - name: Install Playwright (chromium)
        run: pnpm --filter @blog-odya/web exec playwright install --with-deps chromium

      - name: E2E smoke (Playwright)
        run: pnpm test:e2e

      # Lighthouse CI (M1-07, TZ §8.4 / §11 p.7): mobil Performance ≥ 90, SEO = 100,
      # Accessibility ≥ 90, birinchi yuklash JS ≤ 150 KB gzip — bosh sahifa, maqola, kategoriya
      # (demo seed). Shu build'ning `next start`'i — PR'dagi aynan shu kod o'lchanadi.
      # Vercel Preview URL'iga qarshi alohida o'lchov — `lighthouse-preview.yml`.
      - name: Lighthouse CI (mobil)
        working-directory: apps/web
        env:
          LHCI_START_SERVER: '1'
          LHCI_BASE_URL: http://localhost:3100
        run: npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.cjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: apps/web/.lighthouseci/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          retention-days: 7
